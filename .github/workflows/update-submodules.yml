name: Update Submodules

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # run every Monday at 6AM UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  update-submodules:
    runs-on: self-hosted
    env:
      GH_PROMPT_DISABLED: 1
      GIT_TERMINAL_PROMPT: 0

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Update submodules
        run: |
          git submodule update --remote --merge --recursive

      - name: Check for submodule changes
        run: |
          if ! git diff --quiet; then
            echo "Submodule changes detected."
            echo "changes=true" >> $GITHUB_ENV
          else
            echo "No submodule changes detected."
          fi

      - name: Configure git user
        if: env.changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Stage submodule changes
        if: env.changes == 'true'
        run: |
          git add projects/*

      - name: Commit and push submodule changes
        if: env.changes == 'true'
        env:
          BRANCH_NAME: automated/update-submodules
        run: |
          git checkout -B "$BRANCH_NAME"
          git commit -m "chore(submodules): update to latest main (automated)"
          git push --force-with-lease origin "$BRANCH_NAME"

      - name: Create PR with submodule bumps (requests reviewer)
        if: env.changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: automated/update-submodules
          PR_TITLE: 'chore(submodules): update to latest main (automated)'
          PR_BODY: |
            This PR updates the repository's submodule references to the latest tips of their configured branches (e.g., main).
            Automated update created by GitHub Actions.
        run: |
          pr_number="$(gh pr list \
            --head "$BRANCH_NAME" \
            --base "$GITHUB_REF_NAME" \
            --state open \
            --json number \
            --jq '.[0].number // ""')"

          if [ -n "$pr_number" ]; then
            echo "Open PR #$pr_number already exists for $BRANCH_NAME into $GITHUB_REF_NAME."
            exit 0
          fi

          gh pr create \
            --base "$GITHUB_REF_NAME" \
            --head "$BRANCH_NAME" \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
            --label automated \
            --reviewer TitoReinhart-Ampere
